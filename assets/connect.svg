<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 140" width="740" height="140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="30%"  stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="70%"  stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <radialGradient id="bloomL" cx="12%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="bloomR" cx="88%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Shimmer for card sweep -->
    <linearGradient id="shimmerSweep" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="5s" begin="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </linearGradient>

    <filter id="softShadow" x="-3%" y="-5%" width="106%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.07" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="cb"/>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="740" height="140" fill="url(#bg)"/>
  <rect width="740" height="140" fill="url(#bloomL)">
    <animate attributeName="opacity" values="1;0.55;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>
  <rect width="740" height="140" fill="url(#bloomR)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <!-- Main card — floats subtly -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>

    <rect x="14" y="12" width="712" height="116" rx="14" fill="url(#glassCard)" stroke="#1e293b" stroke-width="0.9" filter="url(#softShadow)"/>
    <!-- Top rim highlight -->
    <rect x="14" y="12" width="712" height="0.8" rx="0.4" fill="#ffffff" opacity="0.07"/>
    <!-- Shimmer sweep overlay -->
    <rect x="14" y="12" width="712" height="116" rx="14" fill="url(#shimmerSweep)"/>

    <!-- Top accent bar — breathes -->
    <rect x="14" y="12" width="712" height="2" rx="1" fill="url(#accentLine)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>

    <!-- Section label — slide in from left -->
    <text x="28" y="34"
      font-family="-apple-system,'Segoe UI',Inter,sans-serif"
      font-size="9" font-weight="600" fill="#475569" letter-spacing="2.5" opacity="0">
      CONNECT · NETWORKING
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- Status dot — pulse -->
    <circle cx="688" cy="28" r="3" fill="#10b981" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/>
      <animate attributeName="r" values="3;4.5;3" dur="2.8s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
    <text x="695" y="32"
      font-family="-apple-system,'Segoe UI',Inter,sans-serif"
      font-size="9" font-weight="600" fill="#10b981" letter-spacing="1.5" opacity="0">
      OPEN
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </text>

    <!-- Separator line — draws right -->
    <line x1="28" y1="42" x2="28" y2="42" stroke="#1e293b" stroke-width="0.7">
      <animate attributeName="x2" values="28;712" dur="0.7s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </line>

    <!-- CARD 1: LinkedIn — slides up from y+12 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.45s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <g transform="translate(24, 52)">
        <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
        <!-- Accent bar animates width -->
        <rect x="0" y="8" width="0" height="44" rx="1.25" fill="#2563eb">
          <animate attributeName="width" values="0;2.5" dur="0.3s" begin="0.8s" fill="freeze"/>
        </rect>
        <circle cx="20" cy="22" r="4" fill="#2563eb" opacity="0.9"/>
        <text x="20" y="26" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#f8fafc" text-anchor="middle">in</text>
        <text x="34" y="26" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="10" font-weight="700" fill="#60a5fa">LinkedIn</text>
        <text x="10" y="42" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Mayan Kamboj</text>
        <text x="10" y="55" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#64748b">/in/mayan-kamboj</text>
      </g>
    </g>

    <!-- CARD 2: LeetCode — begin 0.65s -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.45s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <g transform="translate(196, 52)">
        <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
        <rect x="0" y="8" width="0" height="44" rx="1.25" fill="#f59e0b">
          <animate attributeName="width" values="0;2.5" dur="0.3s" begin="0.95s" fill="freeze"/>
        </rect>
        <circle cx="20" cy="22" r="4" fill="#f59e0b" opacity="0.9"/>
        <text x="20" y="26.5" font-family="sans-serif" font-size="6" font-weight="900" fill="#0f172a" text-anchor="middle">LC</text>
        <text x="34" y="26" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="10" font-weight="700" fill="#fbbf24">LeetCode</text>
        <text x="10" y="42" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Mayan_Kamboj</text>
        <text x="10" y="55" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#64748b">DSA · Java · C++</text>
      </g>
    </g>

    <!-- CARD 3: Instagram — begin 0.8s -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.45s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <g transform="translate(368, 52)">
        <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
        <rect x="0" y="8" width="0" height="44" rx="1.25" fill="#ec4899">
          <animate attributeName="width" values="0;2.5" dur="0.3s" begin="1.1s" fill="freeze"/>
        </rect>
        <circle cx="20" cy="22" r="4" fill="#ec4899" opacity="0.9"/>
        <text x="20" y="26" font-family="sans-serif" font-size="9" fill="#f8fafc" text-anchor="middle">◎</text>
        <text x="34" y="26" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="10" font-weight="700" fill="#f472b6">Instagram</text>
        <text x="10" y="42" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">@mayan_kamboj</text>
        <text x="10" y="55" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#64748b">Direct Message</text>
      </g>
    </g>

    <!-- CARD 4: GitHub — begin 0.95s -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0" dur="0.45s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <g transform="translate(540, 52)">
        <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
        <rect x="0" y="8" width="0" height="44" rx="1.25" fill="#34d399">
          <animate attributeName="width" values="0;2.5" dur="0.3s" begin="1.25s" fill="freeze"/>
        </rect>
        <circle cx="20" cy="22" r="4" fill="#34d399" opacity="0.9"/>
        <text x="20" y="26" font-family="sans-serif" font-size="8" fill="#0f172a" text-anchor="middle" font-weight="900">gh</text>
        <text x="34" y="26" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">GitHub</text>
        <text x="10" y="42" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">kambojmayan-png</text>
        <text x="10" y="55" font-family="'SF Mono','Courier New',monospace" font-size="9" fill="#64748b">kambojmayan@gmail</text>
      </g>
    </g>
  </g>
</svg>
