<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 140" width="740" height="140">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glass fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Top accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Subtle ambient blooms -->
    <radialGradient id="bloomL" cx="15%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="bloomR" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <style>
    .card-border-anim {
      stroke-dasharray: 30 300;
      animation: borderFlow 8s linear infinite;
    }
    @keyframes borderFlow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -660; }
    }
  </style>

  <!-- Background -->
  <rect width="740" height="140" rx="0" fill="url(#bg)"/>
  <rect width="740" height="140" fill="url(#bloomL)"/>
  <rect width="740" height="140" fill="url(#bloomR)"/>

  <!-- Card body -->
  <rect x="14" y="12" width="712" height="116" rx="14" fill="url(#glassCard)" stroke="#1e293b" stroke-width="0.9"/>

  <!-- Top inner rim highlight -->
  <rect x="14" y="12" width="712" height="0.8" rx="0.4" fill="#ffffff" opacity="0.07"/>

  <!-- Animated top accent bar -->
  <rect x="14" y="12" width="712" height="2" rx="1" fill="url(#accentLine)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Section label -->
  <text x="28" y="34"
    font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
    font-size="9" font-weight="600" fill="#475569" letter-spacing="2.5">
    CONNECT · NETWORKING
  </text>

  <!-- Status dot + label right side -->
  <circle cx="688" cy="28" r="3" fill="#10b981">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="695" y="32"
    font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
    font-size="9" font-weight="600" fill="#10b981" letter-spacing="1.5">
    OPEN
  </text>

  <!-- Separator -->
  <line x1="28" y1="42" x2="712" y2="42" stroke="#1e293b" stroke-width="0.7"/>

  <!-- CARD 1: LinkedIn -->
  <g transform="translate(24, 52)">
    <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
    <!-- Left accent bar -->
    <rect x="0" y="8" width="2.5" height="44" rx="1.25" fill="#2563eb"/>
    <!-- Icon dots (LinkedIn) -->
    <circle cx="20" cy="22" r="4" fill="#2563eb" opacity="0.9"/>
    <text x="20" y="26" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#f8fafc" text-anchor="middle">in</text>
    <text x="34" y="26" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">LinkedIn</text>
    <text x="10" y="42" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Mayan Kamboj</text>
    <text x="10" y="55" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#64748b">/in/mayan-kamboj</text>
  </g>

  <!-- CARD 2: LeetCode -->
  <g transform="translate(196, 52)">
    <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
    <rect x="0" y="8" width="2.5" height="44" rx="1.25" fill="#f59e0b"/>
    <circle cx="20" cy="22" r="4" fill="#f59e0b" opacity="0.9"/>
    <text x="20" y="26.5" font-family="sans-serif" font-size="6" font-weight="900" fill="#0f172a" text-anchor="middle">LC</text>
    <text x="34" y="26" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">LeetCode</text>
    <text x="10" y="42" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Mayan_Kamboj</text>
    <text x="10" y="55" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#64748b">DSA · Java · C++</text>
  </g>

  <!-- CARD 3: Instagram -->
  <g transform="translate(368, 52)">
    <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
    <rect x="0" y="8" width="2.5" height="44" rx="1.25" fill="#ec4899"/>
    <circle cx="20" cy="22" r="4" fill="#ec4899" opacity="0.9"/>
    <text x="20" y="26" font-family="sans-serif" font-size="9" fill="#f8fafc" text-anchor="middle">◎</text>
    <text x="34" y="26" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#f472b6">Instagram</text>
    <text x="10" y="42" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">@mayan_kamboj</text>
    <text x="10" y="55" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#64748b">Direct Message</text>
  </g>

  <!-- CARD 4: GitHub -->
  <g transform="translate(540, 52)">
    <rect width="160" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <rect width="160" height="60" rx="10" fill="url(#glassCard)"/>
    <rect x="0" y="8" width="2.5" height="44" rx="1.25" fill="#34d399"/>
    <circle cx="20" cy="22" r="4" fill="#34d399" opacity="0.9"/>
    <text x="20" y="26" font-family="sans-serif" font-size="8" fill="#0f172a" text-anchor="middle" font-weight="900">gh</text>
    <text x="34" y="26" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">GitHub</text>
    <text x="10" y="42" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">kambojmayan-png</text>
    <text x="10" y="55" font-family="'SF Mono', 'Courier New', monospace" font-size="9" fill="#64748b">kambojmayan@gmail</text>
  </g>
</svg>
