  <text x="40" y="66" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#e2e8f0">whoami</text>
  <text x="26" y="86" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#94a3b8">
