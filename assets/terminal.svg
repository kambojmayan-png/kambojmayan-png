  <text x="26" y="142" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13">
    <tspan fill="#60a5fa">SENTINEL/</tspan><tspan fill="#475569">  [PyPI sentinel-md]</tspan>
    <tspan fill="#64748b">   </tspan>
    <tspan fill="#60a5fa">chaukas/</tspan><tspan fill="#475569">  [UPI fraud drill]</tspan>
