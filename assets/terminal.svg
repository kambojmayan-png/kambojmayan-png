<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .prompt { fill: #3fb950; font-size: 13px; }
      .cmd    { fill: #79c0ff; font-size: 13px; }
      .out    { fill: #8b949e; font-size: 13px; }
      .val    { fill: #e3b341; font-size: 13px; }
      .hi     { fill: #d2a8ff; font-size: 13px; }
      .box    { fill: #161b22; rx: 8; }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="720" height="260" rx="10" ry="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="720" height="36" rx="10" ry="10" fill="#21262d"/>
  <rect y="18" width="720" height="18" fill="#21262d"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>

  <!-- Title -->
  <text x="360" y="23" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b949e" text-anchor="middle">bash — ~/github-profile</text>

  <!-- Line 1: prompt -->
  <text x="20" y="66" class="mono prompt">┌──(</text>
  <text x="76" y="66" class="mono val">mayan</text>
  <text x="114" y="66" class="mono prompt">@github)-[</text>
  <text x="195" y="66" class="mono val">~/profile</text>
  <text x="258" y="66" class="mono prompt">]</text>

  <!-- Line 2: command -->
  <text x="20" y="88" class="mono prompt">└─$ </text>
  <text x="58" y="88" class="mono cmd">whoami</text>
  <rect x="112" y="76" width="8" height="14" fill="#79c0ff" rx="1">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Output: name -->
  <text x="20" y="110" class="mono out">  Mayan Kamboj</text>

  <!-- Divider -->
  <line x1="20" y1="124" x2="700" y2="124" stroke="#30363d" stroke-width="0.8"/>

  <!-- Line 3: prompt -->
  <text x="20" y="148" class="mono prompt">┌──(</text>
  <text x="76" y="148" class="mono val">mayan</text>
  <text x="114" y="148" class="mono prompt">@github)-[</text>
  <text x="195" y="148" class="mono val">~/profile</text>
  <text x="258" y="148" class="mono prompt">]</text>

  <text x="20" y="170" class="mono prompt">└─$ </text>
  <text x="58" y="170" class="mono cmd">cat about.txt</text>

  <!-- Output info -->
  <text x="20" y="192" class="mono out">  Role    </text>
  <text x="90" y="192" class="mono hi">→  CSE Student · AI &amp; ML</text>

  <text x="20" y="210" class="mono out">  Focus   </text>
  <text x="90" y="210" class="mono hi">→  AI/ML · DSA · Security · Backend</text>

  <text x="20" y="228" class="mono out">  Status  </text>
  <text x="90" y="228" class="mono val">→  Learning → Building → Improving</text>

  <!-- Blinking cursor at end -->
  <rect x="20" y="244" width="8" height="13" fill="#3fb950" rx="1">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
