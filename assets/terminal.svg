<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="740" height="370">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161d29"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="cursorGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="740" height="370" fill="url(#bg)"/>

  <!-- Terminal card frame -->
  <rect x="1" y="1" width="738" height="368" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <rect x="1" y="1" width="738" height="368" rx="12" fill="url(#glass)"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="738" height="38" rx="12" fill="url(#titleBar)"/>
  <rect y="28" width="740" height="12" fill="url(#titleBar)"/>
  <line x1="1" y1="39" x2="739" y2="39" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Window dots -->
  <circle cx="22" cy="19.5" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="41" cy="19.5" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="60" cy="19.5" r="5" fill="#22c55e" opacity="0.85"/>

  <!-- Title text -->
