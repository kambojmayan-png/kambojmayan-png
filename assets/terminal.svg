<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="740" height="370">
  <defs>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="cursorGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window Frame with Border Glow -->
  <rect x="1" y="1" width="738" height="368" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <!-- Title Bar -->
  <rect width="740" height="38" rx="10" fill="url(#titleBar)"/>
  <rect y="28" width="740" height="10" fill="url(#titleBar)"/>
  <line x1="0" y1="38" x2="740" y2="38" stroke="#30363d" stroke-width="0.8"/>

  <!-- Window Controls -->
  <circle cx="22" cy="19" r="5.5" fill="#f43f5e"/>
  <circle cx="42" cy="19" r="5.5" fill="#eab308"/>
  <circle cx="62" cy="19" r="5.5" fill="#10b981"/>

  <!-- Window Title -->
  <text x="370" y="24"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5" fill="#8b949e" text-anchor="middle">mayan@dev-station: ~/profile</text>

  <!-- Command 1: whoami -->
  <text x="24" y="66" font-family="'Courier New', Courier, monospace" font-size="13" fill="#10b981" font-weight="bold">$ </text>
  <text x="42" y="66" font-family="'Courier New', Courier, monospace" font-size="13" fill="#e6edf3">whoami</text>
  <text x="24" y="86" font-family="'Courier New', Courier, monospace" font-size="13" fill="#8b949e">
    mayan kamboj <tspan fill="#58a6ff">— B.E. Computer Science · AI &amp; ML student</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="100" x2="716" y2="100" stroke="#21262d" stroke-width="0.6"/>

  <!-- Command 2: ls projects/ -->
  <text x="24" y="122" font-family="'Courier New', Courier, monospace" font-size="13" fill="#10b981" font-weight="bold">$ </text>
  <text x="42" y="122" font-family="'Courier New', Courier, monospace" font-size="13" fill="#e6edf3">ls -la projects/</text>
  <text x="24" y="142" font-family="'Courier New', Courier, monospace" font-size="12.5">
    <tspan fill="#58a6ff">SENTINEL/</tspan><tspan fill="#6e7681"> [PyPI: sentinel-md]</tspan>
    <tspan fill="#8b949e">  </tspan>
    <tspan fill="#58a6ff">chaukas/</tspan><tspan fill="#6e7681"> [UPI scam drill]</tspan>
    <tspan fill="#8b949e">  </tspan>
    <tspan fill="#58a6ff">AEGIS/</tspan>
    <tspan fill="#8b949e">  </tspan>
    <tspan fill="#58a6ff">Leetcode/</tspan><tspan fill="#6e7681"> [Java/C++]</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="156" x2="716" y2="156" stroke="#21262d" stroke-width="0.6"/>

  <!-- Command 3: cat now.txt -->
  <text x="24" y="178" font-family="'Courier New', Courier, monospace" font-size="13" fill="#10b981" font-weight="bold">$ </text>
  <text x="42" y="178" font-family="'Courier New', Courier, monospace" font-size="13" fill="#e6edf3">cat now.txt</text>

  <text x="24" y="198" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#8b949e">
    status:   <tspan fill="#cdd9e5">B.E. CSE AI/ML student</tspan>
  </text>
  <text x="24" y="216" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#8b949e">
    building: <tspan fill="#58a6ff">SENTINEL</tspan> <tspan fill="#6e7681">(agent security)</tspan> + <tspan fill="#58a6ff">chaukas</tspan> <tspan fill="#6e7681">(fraud prevention)</tspan>
  </text>
  <text x="24" y="234" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#8b949e">
    learning: <tspan fill="#cdd9e5">DSA (LeetCode) · agentic AI defense · Next.js 16 full-stack</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="248" x2="716" y2="248" stroke="#21262d" stroke-width="0.6"/>

  <!-- Command 4: cat socials.json -->
  <text x="24" y="270" font-family="'Courier New', Courier, monospace" font-size="13" fill="#10b981" font-weight="bold">$ </text>
  <text x="42" y="270" font-family="'Courier New', Courier, monospace" font-size="13" fill="#e6edf3">cat socials.json</text>

  <text x="24" y="290" font-family="'Courier New', Courier, monospace" font-size="12" fill="#79c0ff">
    { <tspan fill="#ff7b72">"linkedin"</tspan>: <tspan fill="#a5d6ff">"linkedin.com/in/mayan-kamboj"</tspan>, <tspan fill="#ff7b72">"leetcode"</tspan>: <tspan fill="#a5d6ff">"Mayan_Kamboj"</tspan> }
  </text>
  <text x="24" y="308" font-family="'Courier New', Courier, monospace" font-size="12" fill="#79c0ff">
    { <tspan fill="#ff7b72">"instagram"</tspan>: <tspan fill="#a5d6ff">"@mayan_kamboj"</tspan>, <tspan fill="#ff7b72">"github"</tspan>: <tspan fill="#a5d6ff">"kambojmayan-png"</tspan>, <tspan fill="#ff7b72">"email"</tspan>: <tspan fill="#a5d6ff">"kambojmayan@gmail.com"</tspan> }
  </text>

  <!-- Command 5: active prompt with blinking cursor -->
  <text x="24" y="340" font-family="'Courier New', Courier, monospace" font-size="13" fill="#10b981" font-weight="bold">$ </text>
  <text x="42" y="340" font-family="'Courier New', Courier, monospace" font-size="13" fill="#58a6ff">ready --collaborate</text>
  <rect x="206" y="327" width="8" height="15" rx="1" fill="#10b981" filter="url(#cursorGlow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
