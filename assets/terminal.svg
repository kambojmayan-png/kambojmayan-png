<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <defs>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#22272e"/>
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <rect width="720" height="260" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>

  <!-- Title bar -->
  <rect width="720" height="38" rx="10" fill="url(#titleBar)"/>
  <rect y="28" width="720" height="10" fill="url(#titleBar)"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#30363d" stroke-width="0.8"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="19" r="5.5" fill="#28c840"/>

  <!-- Window title -->
  <text x="360" y="24"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5" fill="#848d97" text-anchor="middle">bash — profile</text>

  <!-- ── Content ── -->

  <!-- prompt + whoami -->
  <text x="20" y="65" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3fb950">$ </text>
  <text x="38" y="65" font-family="'Courier New', Courier, monospace" font-size="13" fill="#cdd9e5">whoami</text>

  <text x="20" y="84" font-family="'Courier New', Courier, monospace" font-size="13" fill="#848d97">mayan kamboj</text>

  <!-- divider -->
  <line x1="20" y1="97" x2="700" y2="97" stroke="#30363d" stroke-width="0.6"/>

  <!-- prompt + ls -->
  <text x="20" y="117" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3fb950">$ </text>
  <text x="38" y="117" font-family="'Courier New', Courier, monospace" font-size="13" fill="#cdd9e5">ls projects/</text>

  <text x="20" y="136" font-family="'Courier New', Courier, monospace" font-size="13">
    <tspan fill="#2f81f7">SENTINEL/</tspan>
    <tspan fill="#848d97">  </tspan>
    <tspan fill="#2f81f7">chaukas/</tspan>
    <tspan fill="#848d97">  </tspan>
    <tspan fill="#2f81f7">AEGIS/</tspan>
    <tspan fill="#848d97">  </tspan>
    <tspan fill="#2f81f7">Leetcode/</tspan>
  </text>

  <!-- divider -->
  <line x1="20" y1="149" x2="700" y2="149" stroke="#30363d" stroke-width="0.6"/>

  <!-- prompt + cat -->
  <text x="20" y="169" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3fb950">$ </text>
  <text x="38" y="169" font-family="'Courier New', Courier, monospace" font-size="13" fill="#cdd9e5">cat now.txt</text>

  <text x="20" y="189" font-family="'Courier New', Courier, monospace" font-size="13" fill="#848d97">studying:  B.E. CSE AI/ML student</text>
  <text x="20" y="208" font-family="'Courier New', Courier, monospace" font-size="13" fill="#848d97">building:  <tspan fill="#cdd9e5">SENTINEL</tspan> and <tspan fill="#cdd9e5">chaukas</tspan></text>
  <text x="20" y="227" font-family="'Courier New', Courier, monospace" font-size="13" fill="#848d97">learning:  DSA · backend · agentic AI</text>
  <text x="20" y="246" font-family="'Courier New', Courier, monospace" font-size="13" fill="#848d97">open to:   <tspan fill="#cdd9e5">collabs on AI/ML · security · civic tech</tspan></text>

  <!-- Blinking cursor -->
  <rect x="20" y="250" width="7" height="12" rx="1" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
