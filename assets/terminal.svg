    <tspan fill="#f87171">"linkedin"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"linkedin.com/in/mayan-kamboj"</tspan>
    <tspan fill="#94a3b8">,  </tspan>
    <tspan fill="#f87171">"leetcode"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Mayan_Kamboj"</tspan>
    <tspan fill="#94a3b8">  }</tspan>
  </text>
  <text x="26" y="312" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="12">
    <tspan fill="#94a3b8">{  </tspan>
    <tspan fill="#f87171">"instagram"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"@mayan_kamboj"</tspan>
    <tspan fill="#94a3b8">,  </tspan>
    <tspan fill="#f87171">"email"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"kambojmayan@gmail.com"</tspan>
