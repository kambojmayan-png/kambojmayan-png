  <text x="26" y="179" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#22c55e" font-weight="600">$</text>
  <text x="40" y="179" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#e2e8f0">cat now.txt</text>

  <text x="26" y="199" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#94a3b8">
