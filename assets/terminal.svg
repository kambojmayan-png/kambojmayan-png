<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="740" height="370">
  <defs>
    <!-- Background dark gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#0f141f"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <!-- Glass card surface -->
    <linearGradient id="termGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Header bar gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0f1624"/>
    </linearGradient>

    <!-- Top rim glow -->
    <linearGradient id="termAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Corner ambient glows -->
    <radialGradient id="termBloomL" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="termBloomR" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Shimmer sweep -->
    <linearGradient id="termShimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="transparent"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="6s" begin="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="termShadow" x="-3%" y="-5%" width="106%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.07" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="cb"/>
      <feMerge>
        <feMergeNode in="cb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cursor neon glow -->
    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="740" height="370" fill="url(#termBg)"/>

  <!-- Ambient background blooms -->
  <rect width="740" height="370" fill="url(#termBloomL)">
    <animate attributeName="opacity" values="1;0.6;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>
  <rect width="740" height="370" fill="url(#termBloomR)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <!-- Floating terminal card group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>

    <!-- Terminal body -->
    <rect x="14" y="10" width="712" height="350" rx="14" fill="#0c111a" stroke="#1e293b" stroke-width="0.9" filter="url(#termShadow)"/>
    <rect x="14" y="10" width="712" height="350" rx="14" fill="url(#termGlass)"/>
    <!-- Top rim highlight -->
    <rect x="14" y="10" width="712" height="0.8" rx="0.4" fill="#ffffff" opacity="0.08"/>
    <!-- Shimmer sweep -->
    <rect x="14" y="10" width="712" height="350" rx="14" fill="url(#termShimmer)"/>

    <!-- Header bar -->
    <path d="M 14,24 A 14,14 0 0,1 28,10 L 712,10 A 14,14 0 0,1 726,24 L 726,46 L 14,46 Z" fill="url(#termHeader)"/>
    <line x1="14" y1="46" x2="726" y2="46" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Accent line at very top -->
    <rect x="14" y="10" width="712" height="1.8" rx="0.9" fill="url(#termAccent)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>

    <!-- macOS window controls -->
    <circle cx="34" cy="28" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="51" cy="28" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="68" cy="28" r="5" fill="#10b981" opacity="0.85"/>

    <!-- Window title -->
    <text x="370" y="32"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
      font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
      mayan@portfolio: ~/workspace
    </text>

    <!-- Status pill on right -->
    <g transform="translate(630, 21)">
      <rect width="82" height="15" rx="7.5" fill="#1e293b" opacity="0.7"/>
      <circle cx="10" cy="7.5" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="10.5" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="9" font-weight="600" fill="#6ee7b7">
        zsh · main
      </text>
    </g>

    <!-- ════════ TERMINAL OUTPUT BODY ════════ -->

    <!-- ── COMMAND 1: $ whoami ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,6;0,0" dur="0.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>

      <!-- Prompt symbol -->
      <text x="32" y="74" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="700" fill="#10b981">❯</text>
      <!-- Directory context -->
      <text x="48" y="74" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#38bdf8">~</text>
      <!-- Command text -->
      <text x="64" y="74" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="600" fill="#f8fafc">whoami</text>
    </g>

    <!-- Command 1 Output -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <text x="48" y="94" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#cbd5e1">
        Mayan Kamboj <tspan fill="#64748b">—</tspan> <tspan fill="#60a5fa" font-weight="600">B.E. CSE AI/ML student</tspan>
      </text>
      <text x="48" y="110" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="11" fill="#64748b">
        ↳ AI agent defensive systems · PyPI author · LeetCode problem solver
      </text>
    </g>

    <!-- Separator 1 -->
    <line x1="32" y1="122" x2="32" y2="122" stroke="#1e293b" stroke-width="0.7">
      <animate attributeName="x2" values="32;708" dur="0.5s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </line>

    <!-- ── COMMAND 2: $ ls projects/ ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,6;0,0" dur="0.4s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>

      <text x="32" y="142" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="700" fill="#10b981">❯</text>
      <text x="48" y="142" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#38bdf8">~</text>
      <text x="64" y="142" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="600" fill="#f8fafc">ls projects/</text>
    </g>

    <!-- Command 2 Output -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <text x="48" y="162" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12">
        <tspan fill="#60a5fa" font-weight="600">SENTINEL/</tspan>
        <tspan fill="#94a3b8"> [PyPI: sentinel-md · AI coding agent AST scanner]</tspan>
      </text>
      <text x="48" y="180" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12">
        <tspan fill="#34d399" font-weight="600">chaukas/</tspan>
        <tspan fill="#94a3b8">  [UPI fraud fire-drill · HACKDAY 1.0]</tspan>
        <tspan fill="#475569">  │  </tspan>
        <tspan fill="#a78bfa" font-weight="600">AEGIS/</tspan>
        <tspan fill="#475569">  │  </tspan>
        <tspan fill="#fbbf24" font-weight="600">Leetcode/</tspan>
      </text>
    </g>

    <!-- Separator 2 -->
    <line x1="32" y1="193" x2="32" y2="193" stroke="#1e293b" stroke-width="0.7">
      <animate attributeName="x2" values="32;708" dur="0.5s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </line>

    <!-- ── COMMAND 3: $ cat focus.json ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,6;0,0" dur="0.4s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>

      <text x="32" y="214" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="700" fill="#10b981">❯</text>
      <text x="48" y="214" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#38bdf8">~</text>
      <text x="64" y="214" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="600" fill="#f8fafc">cat focus.json</text>
    </g>

    <!-- Command 3 Output -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.75s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <text x="48" y="234" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="11.5">
        <tspan fill="#94a3b8">{ </tspan>
        <tspan fill="#f43f5e">"building"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#a5f3fc">"AI Agent Guardrails"</tspan><tspan fill="#94a3b8">, </tspan>
        <tspan fill="#f43f5e">"languages"</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Python"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"TypeScript"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Java"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"C++"</tspan><tspan fill="#94a3b8">]</tspan>
      </text>
      <text x="48" y="252" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="11.5">
        <tspan fill="#94a3b8">  </tspan>
        <tspan fill="#f43f5e">"algorithms"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde047">"DP · Trees · Sliding Window"</tspan><tspan fill="#94a3b8">, </tspan>
        <tspan fill="#f43f5e">"status"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"Open to Collaborate"</tspan>
        <tspan fill="#94a3b8"> }</tspan>
      </text>
    </g>

    <!-- Separator 3 -->
    <line x1="32" y1="266" x2="32" y2="266" stroke="#1e293b" stroke-width="0.7">
      <animate attributeName="x2" values="32;708" dur="0.5s" begin="1.95s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </line>

    <!-- ── COMMAND 4: $ cat socials.sh ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.15s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animateTransform attributeName="transform" type="translate" values="0,6;0,0" dur="0.4s" begin="2.15s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>

      <text x="32" y="287" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="700" fill="#10b981">❯</text>
      <text x="48" y="287" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#38bdf8">~</text>
      <text x="64" y="287" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="600" fill="#f8fafc">cat socials.env</text>
    </g>

    <!-- Command 4 Output -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <text x="48" y="307" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="11.5">
        <tspan fill="#60a5fa">LINKEDIN</tspan><tspan fill="#64748b">=</tspan><tspan fill="#93c5fd">"mayan-kamboj"</tspan>
        <tspan fill="#475569">   │   </tspan>
        <tspan fill="#fbbf24">LEETCODE</tspan><tspan fill="#64748b">=</tspan><tspan fill="#fef08a">"Mayan_Kamboj"</tspan>
        <tspan fill="#475569">   │   </tspan>
        <tspan fill="#f472b6">INSTAGRAM</tspan><tspan fill="#64748b">=</tspan><tspan fill="#fbcfe8">"@mayan_kamboj"</tspan>
      </text>
    </g>

    <!-- ── ACTIVE PROMPT LINE WITH PULSING CURSOR ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.7s" fill="freeze"/>

      <text x="32" y="336" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="700" fill="#10b981">❯</text>
      <text x="48" y="336" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#38bdf8">~</text>
      <text x="64" y="336" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12.5" font-weight="600" fill="#6ee7b7">ready --collaborate</text>

      <!-- Blinking block cursor -->
      <rect x="224" y="323" width="8" height="15" rx="1.5" fill="#10b981" filter="url(#cursorGlow)" opacity="0">
        <animate attributeName="opacity" values="0;0.95;0.95;0;0" dur="1s" begin="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
