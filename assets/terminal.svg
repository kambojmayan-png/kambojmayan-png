  </text>

  <!-- Line 5: prompt with cursor -->
  <text x="26" y="344" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#22c55e" font-weight="600">$</text>
  <text x="40" y="344" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#60a5fa">ready --collaborate</text>
  <rect x="209" y="331" width="8" height="15" rx="1.5" fill="#22c55e" filter="url(#cursorGlow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0.1;0.1" dur="1.1s" repeatCount="indefinite"/>
