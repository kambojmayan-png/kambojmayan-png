<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 185" width="800" height="185">
  <defs>
    <!-- Subtle underline gradient -->
    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="30%"  stop-color="#2f81f7" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#2f81f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="185" fill="#0d1117"/>

  <!-- Top accent strip -->
  <rect width="800" height="2" fill="#2f81f7" opacity="0.7"/>

  <!-- Bottom border -->
  <line x1="0" y1="184" x2="800" y2="184" stroke="#30363d" stroke-width="0.8"/>

  <!-- Name — clean white, no gradient -->
  <text x="400" y="82"
    font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="46" font-weight="700" letter-spacing="2"
    fill="#e6edf3" text-anchor="middle" opacity="0">
    Mayan Kamboj
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="0.15s"/>
  </text>

  <!-- Expanding underline — blue, fades in after name -->
  <rect x="400" y="97" width="0" height="1.5" rx="1" fill="url(#lineAccent)" opacity="0.9">
    <animate attributeName="x"     values="400;240" dur="0.7s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    <animate attributeName="width" values="0;320"   dur="0.7s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </rect>

  <!-- Role / subtitle -->
  <text x="400" y="128"
    font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="15" fill="#2f81f7" text-anchor="middle" letter-spacing="0.8" opacity="0">
    B.E. Computer Science · AI &amp; ML
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- Stack line -->
  <text x="400" y="158"
    font-family="'Courier New', Courier, monospace"
    font-size="12.5" fill="#848d97" text-anchor="middle" letter-spacing="3" opacity="0">
    Python · TypeScript · Java · C++
    <animate attributeName="opacity" values="0;0.9" dur="0.5s" fill="freeze" begin="1.3s"/>
  </text>
</svg>
