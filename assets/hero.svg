<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Animated gradient for name text -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#58a6ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#79c0ff;#bc8cff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#58a6ff" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Gradient for underline/divider -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="25%"  stop-color="#58a6ff"/>
      <stop offset="75%"  stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Corner glow - top left (blue) -->
    <radialGradient id="glowTL" cx="0%" cy="0%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Corner glow - bottom right (purple) -->
    <radialGradient id="glowBR" cx="100%" cy="100%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-15%" y="-60%" width="130%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.345  0 0 0 0 0.651  0 0 0 0 1  0 0 0 0.9 0"
        result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Border glow filter -->
    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.75" fill="#3d8bff" opacity="0.13"/>
    </pattern>

    <!-- Pill gradient fills -->
    <linearGradient id="pill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ── BASE BACKGROUND ── -->
  <rect width="800" height="300" rx="14" fill="#0d1117"/>

  <!-- Dot grid overlay -->
  <rect width="800" height="300" rx="14" fill="url(#dotGrid)"/>

  <!-- Corner glow overlays -->
  <rect width="800" height="300" rx="14" fill="url(#glowTL)"/>
  <rect width="800" height="300" rx="14" fill="url(#glowBR)"/>

  <!-- ── PULSING BORDER ── -->
  <rect x="1" y="1" width="798" height="298" rx="13" fill="none"
    stroke="#58a6ff" stroke-width="1.2" filter="url(#borderGlow)">
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ── FLOATING PARTICLES ── -->
  <!-- 15 particles, varied sizes, colors, speeds, and start times -->
  <circle cx="42"  r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="cy" values="285;15" dur="7s"   repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0;0.8;0" dur="7s"   repeatCount="indefinite" begin="0s"/></circle>
  <circle cx="108" r="1"   fill="#bc8cff" opacity="0"><animate attributeName="cy" values="285;35" dur="9.5s" repeatCount="indefinite" begin="1.2s"/><animate attributeName="opacity" values="0;0.6;0" dur="9.5s" repeatCount="indefinite" begin="1.2s"/></circle>
  <circle cx="175" r="1.5" fill="#79c0ff" opacity="0"><animate attributeName="cy" values="285;50" dur="6.5s" repeatCount="indefinite" begin="2s"/><animate attributeName="opacity" values="0;0.7;0" dur="6.5s" repeatCount="indefinite" begin="2s"/></circle>
  <circle cx="245" r="1"   fill="#58a6ff" opacity="0"><animate attributeName="cy" values="285;40" dur="8.2s" repeatCount="indefinite" begin="0.6s"/><animate attributeName="opacity" values="0;0.55;0" dur="8.2s" repeatCount="indefinite" begin="0.6s"/></circle>
  <circle cx="315" r="2"   fill="#d2a8ff" opacity="0"><animate attributeName="cy" values="285;20" dur="10s"  repeatCount="indefinite" begin="3.5s"/><animate attributeName="opacity" values="0;0.4;0" dur="10s"  repeatCount="indefinite" begin="3.5s"/></circle>
  <circle cx="385" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="cy" values="285;60" dur="7.8s" repeatCount="indefinite" begin="1.7s"/><animate attributeName="opacity" values="0;0.65;0" dur="7.8s" repeatCount="indefinite" begin="1.7s"/></circle>
  <circle cx="455" r="1"   fill="#79c0ff" opacity="0"><animate attributeName="cy" values="285;30" dur="9s"   repeatCount="indefinite" begin="4.2s"/><animate attributeName="opacity" values="0;0.5;0" dur="9s"   repeatCount="indefinite" begin="4.2s"/></circle>
  <circle cx="525" r="1.5" fill="#bc8cff" opacity="0"><animate attributeName="cy" values="285;45" dur="6.8s" repeatCount="indefinite" begin="2.8s"/><animate attributeName="opacity" values="0;0.7;0" dur="6.8s" repeatCount="indefinite" begin="2.8s"/></circle>
  <circle cx="595" r="1"   fill="#58a6ff" opacity="0"><animate attributeName="cy" values="285;38" dur="8.7s" repeatCount="indefinite" begin="0.9s"/><animate attributeName="opacity" values="0;0.5;0" dur="8.7s" repeatCount="indefinite" begin="0.9s"/></circle>
  <circle cx="660" r="1.5" fill="#d2a8ff" opacity="0"><animate attributeName="cy" values="285;65" dur="11s"  repeatCount="indefinite" begin="5.5s"/><animate attributeName="opacity" values="0;0.45;0" dur="11s"  repeatCount="indefinite" begin="5.5s"/></circle>
  <circle cx="720" r="1"   fill="#79c0ff" opacity="0"><animate attributeName="cy" values="285;28" dur="8s"   repeatCount="indefinite" begin="6.3s"/><animate attributeName="opacity" values="0;0.5;0" dur="8s"   repeatCount="indefinite" begin="6.3s"/></circle>
  <circle cx="78"  r="1"   fill="#bc8cff" opacity="0"><animate attributeName="cy" values="285;32" dur="7.2s" repeatCount="indefinite" begin="3.8s"/><animate attributeName="opacity" values="0;0.6;0" dur="7.2s" repeatCount="indefinite" begin="3.8s"/></circle>
  <circle cx="360" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="cy" values="285;42" dur="9.8s" repeatCount="indefinite" begin="1.4s"/><animate attributeName="opacity" values="0;0.4;0" dur="9.8s" repeatCount="indefinite" begin="1.4s"/></circle>
  <circle cx="500" r="1"   fill="#d2a8ff" opacity="0"><animate attributeName="cy" values="285;52" dur="8.3s" repeatCount="indefinite" begin="4.8s"/><animate attributeName="opacity" values="0;0.5;0" dur="8.3s" repeatCount="indefinite" begin="4.8s"/></circle>
  <circle cx="745" r="1.5" fill="#79c0ff" opacity="0"><animate attributeName="cy" values="285;33" dur="7.6s" repeatCount="indefinite" begin="2.3s"/><animate attributeName="opacity" values="0;0.6;0" dur="7.6s" repeatCount="indefinite" begin="2.3s"/></circle>

  <!-- ── MAIN NAME ── -->
  <text x="400" y="126"
    font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="54" font-weight="900" letter-spacing="7"
    fill="url(#nameGrad)" text-anchor="middle"
    filter="url(#textGlow)" opacity="0">
    MAYAN KAMBOJ
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.1s"/>
  </text>

  <!-- ── ANIMATED EXPANDING UNDERLINE ── -->
  <rect x="400" y="143" width="0" height="2" rx="1" fill="url(#lineGrad)">
    <animate attributeName="x"     values="400;175" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="width" values="0;450"   dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- ── SUBTITLE ── -->
  <text x="400" y="180"
    font-family="-apple-system, 'Segoe UI', Arial, sans-serif"
    font-size="15.5" fill="#8b949e" text-anchor="middle" letter-spacing="2.5" opacity="0">
    B.E. Computer Science  •  AI &amp; ML Specialisation
    <animate attributeName="opacity" values="0;0.92" dur="0.8s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- ── LANGUAGE TAGS ROW ── -->
  <text x="400" y="215"
    font-family="'Courier New', Courier, monospace"
    font-size="13" fill="#58a6ff" text-anchor="middle" letter-spacing="5" opacity="0">
    Python  ·  TypeScript  ·  Java  ·  C++
    <animate attributeName="opacity" values="0;0.95" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- ── PROJECT PILL TAGS ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.9s" fill="freeze"/>

    <!-- SENTINEL -->
    <rect x="196" y="242" width="90" height="23" rx="11.5" fill="url(#pill1)" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.55"/>
    <text x="241" y="258" font-family="'Courier New', monospace" font-size="10.5" fill="#58a6ff" text-anchor="middle">🛡️ SENTINEL</text>

    <!-- chaukas -->
    <rect x="298" y="242" width="80" height="23" rx="11.5" fill="url(#pill2)" stroke="#bc8cff" stroke-width="0.8" stroke-opacity="0.55"/>
    <text x="338" y="258" font-family="'Courier New', monospace" font-size="10.5" fill="#bc8cff" text-anchor="middle">🔔 chaukas</text>

    <!-- DSA -->
    <rect x="390" y="242" width="64" height="23" rx="11.5" fill="url(#pill3)" stroke="#3fb950" stroke-width="0.8" stroke-opacity="0.55"/>
    <text x="422" y="258" font-family="'Courier New', monospace" font-size="10.5" fill="#3fb950" text-anchor="middle">🧩 DSA</text>

    <!-- AI/ML -->
    <rect x="466" y="242" width="70" height="23" rx="11.5" fill="url(#pill4)" stroke="#e3b341" stroke-width="0.8" stroke-opacity="0.55"/>
    <text x="501" y="258" font-family="'Courier New', monospace" font-size="10.5" fill="#e3b341" text-anchor="middle">🤖 AI/ML</text>
  </g>
</svg>
