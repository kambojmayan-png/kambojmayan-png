<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Soft ambient background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>

    <!-- Soft centre-left colour bloom -->
    <radialGradient id="bloom1" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f1218" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft centre-right colour bloom -->
    <radialGradient id="bloom2" cx="72%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f1218" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass panel gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Underline gradient -->
    <linearGradient id="underlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Subtle border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Pill gradient subtle -->
    <linearGradient id="pillSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft shadow/glow for card edges -->
    <filter id="softShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.08" result="colour"/>
      <feComposite in="colour" in2="blur" operator="in" result="colourBlur"/>
      <feMerge>
        <feMergeNode in="colourBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>
  <rect width="800" height="200" fill="url(#bloom1)"/>
  <rect width="800" height="200" fill="url(#bloom2)"/>

  <!-- Glass card -->
  <rect x="18" y="16" width="764" height="168" rx="16" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1" filter="url(#softShadow)"/>

  <!-- Top inner highlight (glass rim) -->
  <rect x="18" y="16" width="764" height="1" rx="1" fill="#ffffff" opacity="0.06"/>

  <!-- Name — fade in -->
  <text x="400" y="82"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="46" font-weight="700" letter-spacing="-0.5"
    fill="#f1f5f9" text-anchor="middle" opacity="0">
    Mayan Kamboj
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- Animated underline -->
  <rect x="400" y="97" width="0" height="1.5" rx="1" fill="url(#underlineGrad)">
    <animate attributeName="x"     values="400;218" dur="0.75s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="width" values="0;364"   dur="0.75s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Subtitle — fade in -->
  <text x="400" y="126"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3" opacity="0">
    B.E. Computer Science · AI &amp; Machine Learning
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- Tech pills row -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>

    <!-- Pill 1: Python -->
    <g transform="translate(118, 150)">
      <rect width="72" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect width="72" height="22" rx="11" fill="url(#pillSheen)"/>
      <text x="36" y="15" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#93c5fd" text-anchor="middle">Python</text>
    </g>

    <!-- Pill 2: TypeScript -->
    <g transform="translate(200, 150)">
      <rect width="90" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect width="90" height="22" rx="11" fill="url(#pillSheen)"/>
      <text x="45" y="15" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#93c5fd" text-anchor="middle">TypeScript</text>
    </g>

    <!-- Pill 3: Next.js -->
    <g transform="translate(300, 150)">
      <rect width="78" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect width="78" height="22" rx="11" fill="url(#pillSheen)"/>
      <text x="39" y="15" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Next.js 16</text>
    </g>

    <!-- Pill 4: FastAPI -->
    <g transform="translate(389, 150)">
      <rect width="72" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect width="72" height="22" rx="11" fill="url(#pillSheen)"/>
      <text x="36" y="15" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#6ee7b7" text-anchor="middle">FastAPI</text>
    </g>

    <!-- Pill 5: Java / C++ -->
    <g transform="translate(471, 150)">
      <rect width="84" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect width="84" height="22" rx="11" fill="url(#pillSheen)"/>
      <text x="42" y="15" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#fcd34d" text-anchor="middle">Java · C++</text>
    </g>

    <!-- Pill 6: PyPI Author -->
    <g transform="translate(565, 150)">
      <rect width="90" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <rect width="90" height="22" rx="11" fill="url(#pillSheen)"/>
      <text x="45" y="15" font-family="-apple-system, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#c4b5fd" text-anchor="middle">PyPI Author</text>
    </g>
  </g>
</svg>
