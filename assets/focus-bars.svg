<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="740" height="210">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1a2535"/>
    </linearGradient>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="30%"  stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Shimmer sweep across the whole card -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="65%"  stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="6s" begin="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="740" height="210" fill="url(#bg)"/>

  <!-- Glass card body -->
  <rect x="14" y="12" width="712" height="186" rx="14" fill="url(#glass)" stroke="#1e293b" stroke-width="0.9"/>
  <!-- Shimmer sweep layer -->
  <rect x="14" y="12" width="712" height="186" rx="14" fill="url(#shimmer)"/>
  <!-- Top rim highlight -->
  <rect x="14" y="12" width="712" height="0.8" rx="0.4" fill="#ffffff" opacity="0.07"/>

  <!-- Accent top bar — breathes -->
  <rect x="14" y="12" width="712" height="1.8" rx="0.9" fill="url(#accent)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <!-- Section label — fade in -->
  <text x="28" y="34"
    font-family="-apple-system,'Segoe UI',Inter,sans-serif"
    font-size="9" font-weight="600" fill="#475569" letter-spacing="2.5" opacity="0">
    CORE COMPETENCIES · ACTIVE FOCUS
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.1s" fill="freeze"/>
  </text>

  <!-- Separator line — draws right -->
  <line x1="28" y1="42" x2="28" y2="42" stroke="#1e293b" stroke-width="0.7">
    <animate attributeName="x2" values="28;712" dur="0.65s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- ── ROW 1: Agentic AI (86%) ── -->
  <!-- Label slides right -->
  <text x="30" y="70" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12.5" font-weight="500" fill="#e2e8f0" opacity="0">
    Agentic AI &amp; Security
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
  </text>
  <!-- Track -->
  <rect x="300" y="59" width="340" height="8" rx="4" fill="url(#track)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.35s" fill="freeze"/>
  </rect>
  <!-- Fill bar -->
  <rect x="300" y="59" width="0" height="8" rx="4" fill="url(#b1)">
    <animate attributeName="width" values="0;292" dur="1.1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <!-- End dot — pulses after bar reaches target -->
  <circle cx="592" cy="63" r="0" fill="#60a5fa">
    <animate attributeName="r" values="0;4;3" dur="0.5s" begin="1.55s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <!-- Percentage -->
  <text x="654" y="68" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="11" font-weight="600" fill="#60a5fa" opacity="0">
    86%
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- ── ROW 2: Python & Backend (82%) ── -->
  <text x="30" y="104" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12.5" font-weight="500" fill="#e2e8f0" opacity="0">
    Python, FastAPI &amp; Backend
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.55s" fill="freeze"/>
  </text>
  <rect x="300" y="93" width="340" height="8" rx="4" fill="url(#track)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
  </rect>
  <rect x="300" y="93" width="0" height="8" rx="4" fill="url(#b2)">
    <animate attributeName="width" values="0;279" dur="1.1s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="579" cy="97" r="0" fill="#2dd4bf">
    <animate attributeName="r" values="0;4;3" dur="0.5s" begin="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <text x="654" y="102" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" opacity="0">
    82%
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.65s" fill="freeze"/>
  </text>

  <!-- ── ROW 3: TypeScript & Next.js (78%) ── -->
  <text x="30" y="138" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12.5" font-weight="500" fill="#e2e8f0" opacity="0">
    TypeScript &amp; Next.js 16
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
  </text>
  <rect x="300" y="127" width="340" height="8" rx="4" fill="url(#track)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.85s" fill="freeze"/>
  </rect>
  <rect x="300" y="127" width="0" height="8" rx="4" fill="url(#b3)">
    <animate attributeName="width" values="0;265" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="565" cy="131" r="0" fill="#a78bfa">
    <animate attributeName="r" values="0;4;3" dur="0.5s" begin="2.05s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <text x="654" y="136" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" opacity="0">
    78%
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- ── ROW 4: DSA & LeetCode (72%) ── -->
  <text x="30" y="172" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="12.5" font-weight="500" fill="#e2e8f0" opacity="0">
    DSA &amp; LeetCode · Java / C++
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.05s" fill="freeze"/>
  </text>
  <rect x="300" y="161" width="340" height="8" rx="4" fill="url(#track)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
  </rect>
  <rect x="300" y="161" width="0" height="8" rx="4" fill="url(#b4)">
    <animate attributeName="width" values="0;245" dur="1.1s" begin="1.15s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="545" cy="165" r="0" fill="#fbbf24">
    <animate attributeName="r" values="0;4;3" dur="0.5s" begin="2.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" begin="2.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>
  <text x="654" y="170" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="11" font-weight="600" fill="#fbbf24" opacity="0">
    72%
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.15s" fill="freeze"/>
  </text>
</svg>
