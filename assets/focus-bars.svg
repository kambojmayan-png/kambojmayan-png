<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240">
  <defs>
    <!-- Card gradient background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Bar track gradient -->
    <linearGradient id="track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#1a1f27"/>
    </linearGradient>

    <!-- Individual bar gradients -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#f0c97a"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="100%" stop-color="#ff9580"/>
    </linearGradient>

    <!-- Glow for bars -->
    <filter id="barGlow" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Edge glow for card -->
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card border glow -->
  <rect x="1" y="1" width="738" height="238" rx="12" fill="none"
    stroke="#58a6ff" stroke-width="1" filter="url(#cardGlow)" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Card body -->
  <rect width="740" height="240" rx="12" fill="url(#cardBg)"/>

  <!-- Header section -->
  <rect width="740" height="52" rx="12" fill="#161b22"/>
  <rect y="40" width="740" height="12" fill="#161b22"/>
  <line x1="0" y1="52" x2="740" y2="52" stroke="#30363d" stroke-width="0.8"/>

  <!-- Section title -->
  <text x="30" y="33"
    font-family="'Courier New', Courier, monospace"
    font-size="13" fill="#8b949e" letter-spacing="3">
    <tspan fill="#3fb950">▶</tspan>  // CURRENT FOCUS
  </text>

  <!-- ── FOCUS BARS (5 items) ── -->
  <!-- Each bar: label | track | animated fill | percentage -->
  <!-- Track width = 370px, starts at x=210, bars animate from width=0 -->

  <!-- Item 1: Agentic AI & Security — 80% = 296px -->
  <text x="30" y="87" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">🤖  Agentic AI &amp; Security</text>
  <rect x="210" y="74" width="370" height="10" rx="5" fill="url(#track)"/>
  <rect x="210" y="74" width="0"   height="10" rx="5" fill="url(#bar1)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;296" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="592" y="85" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff" opacity="0">
    80%
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- Item 2: DSA / Algorithms — 68% = 251px -->
  <text x="30" y="123" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">🧩  DSA / Algorithms</text>
  <rect x="210" y="110" width="370" height="10" rx="5" fill="url(#track)"/>
  <rect x="210" y="110" width="0"   height="10" rx="5" fill="url(#bar2)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;251" dur="1.5s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="592" y="121" font-family="'Courier New', monospace" font-size="11" fill="#bc8cff" opacity="0">
    68%
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Item 3: Python / Backend — 78% = 288px -->
  <text x="30" y="159" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">🐍  Python / Backend</text>
  <rect x="210" y="146" width="370" height="10" rx="5" fill="url(#track)"/>
  <rect x="210" y="146" width="0"   height="10" rx="5" fill="url(#bar3)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;288" dur="1.5s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="592" y="157" font-family="'Courier New', monospace" font-size="11" fill="#3fb950" opacity="0">
    78%
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.1s" fill="freeze"/>
  </text>

  <!-- Item 4: TypeScript / Next.js — 74% = 273px -->
  <text x="30" y="195" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">🌐  TypeScript / Next.js</text>
  <rect x="210" y="182" width="370" height="10" rx="5" fill="url(#track)"/>
  <rect x="210" y="182" width="0"   height="10" rx="5" fill="url(#bar4)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;273" dur="1.5s" begin="1.05s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="592" y="193" font-family="'Courier New', monospace" font-size="11" fill="#e3b341" opacity="0">
    74%
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze"/>
  </text>

  <!-- Item 5: Java / OOP — 66% = 244px -->
  <text x="30" y="231" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">📘  Java / OOP</text>
  <rect x="210" y="218" width="370" height="10" rx="5" fill="url(#track)"/>
  <rect x="210" y="218" width="0"   height="10" rx="5" fill="url(#bar5)" filter="url(#barGlow)">
    <animate attributeName="width" values="0;244" dur="1.5s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="592" y="229" font-family="'Courier New', monospace" font-size="11" fill="#f78166" opacity="0">
    66%
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>
  </text>
</svg>
