<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 40" width="720" height="40">
  <defs>
    <style>
      .label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #8b949e; letter-spacing: 6px; }
    </style>
    <!-- Moving gradient sweep for a subtle shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#30363d" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#bc8cff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 2 0; -1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="720" height="40" fill="none"/>

  <!-- Separator line -->
  <line x1="0" y1="20" x2="720" y2="20" stroke="url(#shimmer)" stroke-width="1"/>

  <!-- Label -->
  <text x="360" y="25" class="label" text-anchor="middle">LEARN · BUILD · BREAK · FIX · REPEAT</text>
</svg>
